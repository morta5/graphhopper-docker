name: GraphHopper Image CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: graphhopper-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image, Sicherheitsgate und echte Autofahrt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Kontrolliertes Laufzeitimage bauen
        run: docker build -f Dockerfile.staging -t graphhopper-ci:proof .
      - name: HIGH und CRITICAL sperren
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --severity HIGH,CRITICAL --exit-code 1 graphhopper-ci:proof
      - name: Autofahrt mit synthetischen Straßen und nicht privilegierter Laufzeit
        run: python3 scripts/image-smoke.py --image graphhopper-ci:proof
